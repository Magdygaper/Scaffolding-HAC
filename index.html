function importMD(file){const rd=new FileReader();rd.onload=async e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});
 const syn={c:['item code','sort fld','code'],s:['sap code','sap'],n:['item name','object description','description','name'],g:['group','categ'],d:['default source','source'],w:['weight'],i:['internal rent','internal','hac rent'],x:['external rent','external'],p:['purchase value','purchase','replacement','unit price']};
 let best=null;
 wb.SheetNames.forEach(sn=>{const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null});for(let h=0;h<Math.min(A.length,30);h++){const H=(A[h]||[]).map(x=>String(x==null?'':x).trim().toLowerCase()),col={};let sc=0;
  for(const k in syn){let j=-1;for(const t of syn[k]){j=H.findIndex(v=>v===t);if(j>=0)break}if(j<0)for(const t of syn[k]){j=H.findIndex(v=>v&&v.includes(t));if(j>=0)break}col[k]=j;if(j>=0)sc++}
  if(col.c>=0&&col.n>=0&&col.c!==col.n){if(col.s===col.c)col.s=-1;const score=sc*1e5+A.length;if(!best||score>best.score)best={score,A,h,col,sn};break}}});
 if(!best)throw Error('Need columns: Item Code, Item Name (checked all sheets, first 30 rows)');
 const {A,h,col}=best,ops=[],seen=new Set(),g=(r,k)=>col[k]>=0?r[col[k]]:null;
 A.slice(h+1).forEach(r=>{const c0=g(r,'c');if(!c0||/^#n\/a$/i.test(String(c0)))return;const id=String(c0).trim().toUpperCase().replace(/\//g,'-');if(seen.has(id))return;seen.add(id);const sp=String(g(r,'s')||'').trim(),src=g(r,'d');
  ops.push(['s','fs_master',id,{code:id,sap:/^#n\/a$/i.test(sp)?'':sp,name:String(g(r,'n')||'').trim(),group:g(r,'g')||'Other',src:SRC.includes(src)?src:'Owned',weight:+g(r,'w')||0,rent:+g(r,'i')||0,ext:+g(r,'x')||0,price:+g(r,'p')||0}])});
 if(!ops.length)throw Error('No item rows found in sheet '+best.sn);
 await DB.batch(ops);toast(ops.length+' items imported into Master Data (sheet: '+best.sn+')')}catch(x){toast('Import failed: '+x.message)}};rd.readAsArrayBuffer(file)}
