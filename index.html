function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);if(Math.abs(m-n)>2)return 9;
 let prev=Array.from({length:n+1},(_,i)=>i);
 for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}
 return prev[n]}

function tokset(n){const out=new Set();String(n).split(' ').forEach(t=>{if(!t)return;out.add(t);let x=t;
 if(x.length>4&&x[0]==='و'){x=x.slice(1);out.add(x)}
 if(x.length>5&&x.startsWith('بال')){x=x.slice(3);out.add(x)}else if(x.length>4&&(x.startsWith('ال')||x.startsWith('لل'))){x=x.slice(2);out.add(x)}});return[...out]}
function has(n,k){const ws=WORDS[k]||[];const tk=tokset(n);
 for(const w of ws){if(w.includes(' ')){if(n.includes(w))return 1;continue}
  if(tk.includes(w))return 1;
  if(w.length>=4)for(const t of tk){if(t.length>=4&&Math.abs(t.length-w.length)<=1&&lev(t,w)<=1)return .75}}
 return 0}
const any=(n,...ks)=>ks.reduce((a,k)=>Math.max(a,has(n,k)),0);

 const scored=all.map(m=>{const nm=norm(m.name).split(' ');let s=0;nm.forEach(w=>{if(w.length>3&&tk.includes(w))s+=2;else if(w.length>4&&tk.some(t2=>lev(t2,w)<=1))s+=1});return{m,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
 if(!scored.length)return[];const top=scored[0].s;return scored.filter(x=>x.s>=top).map(x=>x.m)}

function findProj(t){const n=norm(t),tk=n.split(' ').filter(w=>w.length>2);
 const all=Object.values(PJ).map(p=>p.name).filter(Boolean);
 const ex=all.find(p=>norm(p)===n);if(ex)return ex;
 const inc=all.filter(p=>n.includes(norm(p)));if(inc.length)return inc.sort((a,b)=>b.length-a.length)[0];
 const sc=all.map(p=>{const w=norm(p).split(' ').filter(x=>x.length>2);let s=0;w.forEach(x=>{if(tk.includes(x))s+=2;else if(tk.some(t2=>lev(t2,x)<=1))s+=1});return{p,s}}).filter(x=>x.s>1).sort((a,b)=>b.s-a.s);

function actionRoute(q){const n=norm(q),pr=prCandidates(q)[0]||(CTXM.pr?PRS[CTXM.pr]:null);
 const wantsClose=has(n,'close')>0,wantsOpen=has(n,'open')>0;
 const nav=/داشبورد|dashboard|ارصده|الارصدة|سجل|register|حركات|movements|موردين|workflow|بورد|الدليل|النموذج|الفورم/.test(n);
 if((wantsClose||wantsOpen)&&!nav){
  if(!pr)return{lead:'أنهي PR؟',body:'<div class="note">قولّي رقم الـ PR أو افتحه الأول.</div>',src:'kb'};
  const sm=n.match(/(owned|rental|asset|tbd|مملوك|ايجار|اصل)/);
  const ph=/return|مرتجع|رجوع|ret\b/.test(n)?'R':(/deliver|توريد|dlv|del\b/.test(n)?'D':null);
  if(sm&&ph){const s={owned:'Owned',rental:'Rental',asset:'Asset',tbd:'TBD',مملوك:'Owned',ايجار:'Rental',اصل:'Asset'}[sm[1]];
   return propose('cell.toggle',{prId:pr.id,s,ph,v:wantsClose})}
  if(wantsOpen&&!pr.closed){openPR(pr.id);return prCard(pr)}
  return propose(wantsClose?'pr.close':'pr.open',{prId:pr.id})}
 const setSrc=n.match(/(خلي|خليه|خليها|غير|حول|set|change).*(owned|rental|asset|tbd|مملوك|ايجار|اصل)/);
 if(setSrc||(/مصدر/.test(n)&&/(owned|rental|asset|tbd)/.test(n))){
  const it=findItem(q)||MD_BY(CTXM.item||'');const p=pr||(DR?PRS[DR.id]:null);
  const target=(setSrc?setSrc[2]:n.match(/(owned|rental|asset|tbd)/)[1]);
  const s={owned:'Owned',rental:'Rental',asset:'Asset',tbd:'TBD',مملوك:'Owned',ايجار:'Rental',اصل:'Asset'}[target];

    $('vnb').onclick=go;$('vni').onkeydown=e=>{if(e.key==='Enter')go()};$('vni').focus();

async function resolveMyName(email){
  if(ISADMIN) return 'Admin';
  if(MYPROJ) return email.split('@')[0].slice(0,60);
  let n='',f='';
  try{ n=sessionStorage.getItem('viewer_name')||''; f=sessionStorage.getItem('viewer_for')||''; }catch(e){}
  if(n && f===email) return n;
  n = await askViewerName();
  try{ sessionStorage.setItem('viewer_name',n); sessionStorage.setItem('viewer_for',email); }catch(e){}
  return n;
}
function clearSessionMemo(){ try{ sessionStorage.removeItem('hac_sid'); sessionStorage.removeItem('viewer_name'); sessionStorage.removeItem('viewer_for'); }catch(e){} }

function accessBlockReason(a){
  a = a || {};
  if(a.blocked) return 'الحساب متوقف بواسطة الأدمن';
  const ku = +(a.kickUntil || 0), left = ku - nowMs();
  if(left > 0) return 'الأدمن أنهى جلستك — تقدر تدخل تاني بعد ' + Math.ceil(left/60000) + ' دقيقة';
  return '';
}
function isOnlinePresence(p){
  return !!p && !p.blocked && p.online !== false && (nowMs() - (+p.lastSeen || 0) < ONLINE_AFTER_MS);
}

function accessDocId(email){
  return String(email || '').toLowerCase().replace(/[\/\s]+/g,'-');
}

async function writeLoginEvent(type, extra){
  try{
    const u = au.currentUser;
    if(!u) return;

    await fs.collection('fs_login_log').add({
      type,
      email:(u.email || '').toLowerCase(),
      name:MYNAME || '',
      uid:u.uid,
      sessionId:SESSION_ID || '',
      role:ISADMIN ? 'admin' : MYPROJ ? 'project' : 'viewer',
      project:MYPROJ || '',
      device:deviceInfo(),
      userAgent:navigator.userAgent || '',
      at:nowMs(),
      ...(extra || {})
    });
  }catch(e){
    console.warn('login log failed', e);
  }
}

async function heartbeat(){
  try{
    const u = au.currentUser;
    if(!u || !SESSION_ID || FORCE_LOGGING_OUT) return;

    const email = (u.email || '').toLowerCase();

    await fs.collection('fs_presence').doc(SESSION_ID).set({
      email,
      name:MYNAME || '',
      uid:u.uid,
      sessionId:SESSION_ID,
      role:ISADMIN ? 'admin' : MYPROJ ? 'project' : 'viewer',
      project:MYPROJ || '',
      mode:MODE || '',
      selectedProject:PSEL || 'All',
      openPR:DR && PRS[DR.id] ? PRS[DR.id].no : '',
      device:deviceInfo(),
      userAgent:navigator.userAgent || '',
      online:true,
      startedAt:window.__HAC_SESSION_STARTED || nowMs(),
      lastSeen:nowMs()
    }, {merge:true});

  }catch(e){
    console.warn('heartbeat failed', e);
  }
}

function stopPresence(){
  if(HB_TIMER){
    clearInterval(HB_TIMER);
    HB_TIMER = null;
  }

  if(PRESENCE_UNSUB){
    try{ PRESENCE_UNSUB(); }catch(e){}
    PRESENCE_UNSUB = null;
  }

  if(ACCESS_UNSUB){
    try{ ACCESS_UNSUB(); }catch(e){}
    ACCESS_UNSUB = null;
  }
  if(ACC_ALL_UNSUB){
    try{ ACC_ALL_UNSUB(); }catch(e){}
    ACC_ALL_UNSUB = null;
  }
  ACC_ALL = {};

  const oldSid = SESSION_ID;
  SESSION_ID = null;
  ACCESS = null;
  PRES = {};

  const btn = $('presenceBtn');
  if(btn) btn.style.display = 'none';

  if(oldSid){
    try{
      fs.collection('fs_presence').doc(oldSid).set({
        online:false,
        endedAt:nowMs(),
        lastSeen:nowMs()
      }, {merge:true}).catch(()=>{});
    }catch(e){}
  }
}

async function startPresence(){
  const u = au.currentUser;
  if(!u) return;

  stopPresence();

  FORCE_LOGGING_OUT = false;
  let sid = null;
  try{ sid = sessionStorage.getItem('hac_sid'); }catch(e){}
  if(!sid){ sid = uid('SES_'); try{ sessionStorage.setItem('hac_sid', sid); }catch(e){} }
  SESSION_ID = sid;
  window.__HAC_SESSION_STARTED = nowMs();

  const email = (u.email || '').toLowerCase();
  const aid = accessDocId(email);

  MYNAME = await resolveMyName(email);
  if(!au.currentUser) return;

  await writeLoginEvent('login');

  // اسمع لحالة حسابك: blocked / forceLogoutAt
  ACCESS_UNSUB = fs.collection('fs_access').doc(aid).onSnapshot(async snap=>{
    ACCESS = snap.exists ? snap.data() : {};

    const forcedAt = +(ACCESS.forceLogoutAt || 0);
    const sessionStarted = +(window.__HAC_SESSION_STARTED || 0);

    const why = accessBlockReason(ACCESS);
    if(why){
      await forceLogout(why);
      return;
    }

    // لو الأدمن عمل طرد بعد بداية الجلسة الحالية
    if(forcedAt && forcedAt > sessionStarted){
      await forceLogout('الأدمن أنهى الجلسة');
      return;
    }
  }, e=>{
    console.warn('access listener error', e);
  });

  // الأدمن فقط يشوف كل المتصلين
  if(ISADMIN){
    const btn = $('presenceBtn');
    if(btn) btn.style.display = 'inline-flex';

    ACC_ALL_UNSUB = fs.collection('fs_access').onSnapshot(sn=>{
      ACC_ALL = {};
      sn.forEach(d=>ACC_ALL[d.id] = d.data());
      if(DR && DR.presence) renderPresence();
    }, e=>console.warn('fs_access list', e));

    PRESENCE_UNSUB = fs.collection('fs_presence')
      .orderBy('lastSeen','desc')
      .limit(100)
      .onSnapshot(sn=>{
        PRES = {};
        sn.forEach(d=>PRES[d.id] = {id:d.id, ...d.data()});
        updateOnlineCount();

        if(DR && DR.presence){
          renderPresence();
        }
      }, e=>{
        toast('Presence: ' + (e.message || e.code));
      });
  }

  await heartbeat();

  HB_TIMER = setInterval(heartbeat, HEARTBEAT_MS);
}

async function forceLogout(reason){
  if(FORCE_LOGGING_OUT) return;
  FORCE_LOGGING_OUT = true;

  try{
    await writeLoginEvent('forced_logout', {reason});

  stopPresence();
  clearSessionMemo();
  stopAll();

  try{
    await au.signOut();
  }catch(e){}

  $('login').style.display = 'grid';
  $('le').textContent = reason || 'تم إنهاء الجلسة';

async function kickSession(sessionId,email){
  if(!ISADMIN) return toast('للأدمن بس');

  const myEmail = (au.currentUser || {}).email || '';
  if(String(email).toLowerCase() === String(myEmail).toLowerCase()){
    return toast('مش هتطرد نفسك من هنا');
  }

  const mins = parseInt(prompt('طرد ' + email + '\nمدة منع الدخول بالدقايق (0 = خروج بس ويقدر يدخل تاني)', '60'), 10);
  if(isNaN(mins) || mins < 0) return;

  const t = nowMs();
  const aid = accessDocId(email);

  try{
    const b = fs.batch();

    b.set(fs.collection('fs_access').doc(aid), {
      email:String(email).toLowerCase(),
      forceLogoutAt:t,
      kickUntil:mins > 0 ? t + mins*60000 : 0,
      kickedBy:me(),
      updatedAt:t
    }, {merge:true});

    b.set(fs.collection('fs_presence').doc(sessionId), {
      online:false,
      kicked:true,
      kickedAt:t,
      kickedBy:me(),
      lastSeen:t
    }, {merge:true});

    b.set(fs.collection('fs_login_log').doc(), {
      type:'kick_session',
      email:me(),
      targetEmail:String(email).toLowerCase(),
      sessionId,
      by:me(),
      at:t,
      reason:'Admin kicked session' + (mins > 0 ? ' · منع ' + mins + ' دقيقة' : '')
    });

    await b.commit();

    audit('طرد جلسة: ' + email, 1);
    toast(mins > 0 ? 'تم الطرد ✓ ومنع الدخول ' + mins + ' دقيقة' : 'تم طرد الجلسة ✓');
  }catch(e){
    toast('فشل الطرد: ' + (e.message || e.code));
  }
}

async function clearKick(email){
  if(!ISADMIN) return toast('للأدمن بس');
  try{
    await fs.collection('fs_access').doc(accessDocId(email)).set({email:String(email).toLowerCase(), kickUntil:0, updatedAt:nowMs()}, {merge:true});
    toast('تم فك المنع ✓');
  }catch(e){ toast('فشل: ' + (e.message || e.code)); }
}
async function blockUser(email,block){
  if(!ISADMIN) return toast('للأدمن بس');

  const myEmail = (au.currentUser || {}).email || '';
  if(String(email).toLowerCase() === String(myEmail).toLowerCase()){
    return toast('مش هتوقف حسابك الحالي');
  }

  if(!confirm((block?'وقف حساب ':'فك الوقف عن ') + email + ' ؟')) return;

  const t = nowMs();
  const aid = accessDocId(email);

  try{
    const b = fs.batch();

    b.set(fs.collection('fs_access').doc(aid), {
      email:String(email).toLowerCase(),
      blocked:!!block,
      forceLogoutAt:block ? t : 0,
      blockedBy:block ? me() : '',
      unblockedBy:!block ? me() : '',
      updatedAt:t
    }, {merge:true});

    b.set(fs.collection('fs_login_log').doc(), {
      type:block ? 'block_user' : 'unblock_user',
      email:me(),
      targetEmail:String(email).toLowerCase(),
      by:me(),
      at:t,
      reason:block ? 'Admin blocked user' : 'Admin unblocked user'
    });

    await b.commit();

    audit((block?'وقف حساب: ':'فك وقف حساب: ') + email, 1);
    toast(block ? 'الحساب اتوقف ✓' : 'تم فك الوقف ✓');
  }catch(e){
    toast('فشل: ' + (e.message || e.code));
  }
}

/* ================= sketch: draw the shape on a grid, drag corners, get the area ================= */
let SK=null;
const skArea=p=>{let a=0;p.forEach((q,i)=>{const r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]});return Math.abs(a)/2};
const skSq=()=>+(skArea(SK.pts)*SK.g*SK.g).toFixed(2);
const skCell=e=>{const v=$('sks'),r=v.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width/20,(e.clientY-r.top)*400/r.height/20]};
function skOpen(ix){const a=ix>=0?(NF.areas||[])[ix]:null;SK={g:a?a.g:1,pts:a?skP(a):[],closed:!!a,drag:-1,free:a?a.pts.some(v=>v%1!==0):false,cal:null,ix:a?ix:-1,n:a?a.n:'Area '+String.fromCharCode(65+(NF.areas||[]).length%26)};let d=$('sk');if(!d){d=document.createElement('div');d.className='modal';d.id='sk';document.body.appendChild(d)}
 d.innerHTML=`<div class="box" style="width:min(700px,100%);max-height:94vh;overflow:auto"><h3>Sketch area</h3><div class="sub">Click to place corners, click the first point to close. Then drag any corner to adjust. Or start from a typed Length &times; Width. Each square = the grid size.</div>
 <div class="tools" style="margin:10px 0 6px"><input id="skn" placeholder="Name (e.g. Slab A)" value="${E(SK.n)}" style="width:150px"><span class="sub">Grid</span><select id="skg" onchange="SK.g=+this.value;skDraw()">${[0.1,0.25,0.5,1,2,5].map(g=>`<option value="${g}" ${g===SK.g?'selected':''}>${g} m</option>`).join('')}</select><input id="skl" type="number" min="0" step="any" placeholder="L m" style="width:75px"><input id="skw" type="number" min="0" step="any" placeholder="W m" style="width:75px"><button class="sm" onclick="$('skf').click()" title="Trace over a plan image (PNG / JPG)">Plan image</button><input id="skf" type="file" accept="image/*" onchange="skImg(this)"><button class="sm" onclick="skCal()" title="Click two points of a known distance on the plan">Set scale</button><button class="sm" onclick="skPre(0)">Rectangle</button><button class="sm" onclick="skPre(1)">L-shape</button></div>
 <svg id="sks" viewBox="0 0 600 400" style="width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;touch-action:none;cursor:crosshair"><defs><pattern id="skp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#30363d" stroke-width=".6"/></pattern></defs><image id="skim" width="600" height="400" preserveAspectRatio="xMidYMid meet" opacity=".6" style="display:none"/><rect width="600" height="400" fill="url(#skp)"/><g id="skd"></g></svg>
 <div id="ski" class="card" style="margin:8px 0"></div>
 <div class="tools"><button class="sm" onclick="SK.closed?SK.closed=false:SK.pts.pop();skDraw()">Undo</button><button class="sm dg" onclick="SK.pts=[];SK.closed=false;skDraw()">Clear</button><button class="sm" onclick="SK.pts.length>2&&(SK.closed=true);skDraw()">Close shape</button><span style="flex:1"></span><button class="sm" onclick="$('sk').remove();SK=null">Cancel</button><button class="btn" onclick="skUse()">Use this area</button></div></div>`;
 {const sel=$('skg');if(![...sel.options].some(o=>+o.value===SK.g))sel.add(new Option(SK.g+' m (scaled)',SK.g));sel.value=SK.g}
 const v=$('sks');v.addEventListener('pointerdown',skDown);v.addEventListener('pointermove',skMove);v.addEventListener('pointerup',()=>{SK.drag=-1});skDraw()}
const sr=x=>SK.free?+x.toFixed(2):Math.round(x);
function skDown(e){const c=skCell(e);if(SK.cal){SK.cal.push(c);if(SK.cal.length===2){const D=Math.hypot(SK.cal[0][0]-SK.cal[1][0],SK.cal[0][1]-SK.cal[1][1]),R=+(prompt('Real distance between the two points (meters)?')||0);SK.cal=null;if(D>.2&&R>0){SK.g=+(R/D).toFixed(4);const sel=$('skg');if(![...sel.options].some(o=>+o.value===SK.g))sel.add(new Option(SK.g+' m (scaled)',SK.g));sel.value=SK.g;SK.free=true;toast('Scale set: 1 square = '+SK.g+' m. Now trace the shape.')}else toast('Scale not set - click two points apart and enter a distance')}skDraw();return}const i=SK.pts.findIndex(q=>Math.hypot(q[0]-c[0],q[1]-c[1])<.5),sn=[Math.max(0,Math.min(30,sr(c[0]))),Math.max(0,Math.min(20,sr(c[1])))];
 if(SK.closed){if(i>=0){SK.drag=i;$('sks').setPointerCapture(e.pointerId)}}
 else if(i===0&&SK.pts.length>2)SK.closed=true;else if(i<0)SK.pts.push(sn);skDraw()}
function skMove(e){if(!SK||SK.drag<0)return;const c=skCell(e);SK.pts[SK.drag]=[Math.max(0,Math.min(30,sr(c[0]))),Math.max(0,Math.min(20,sr(c[1])))];skDraw()}
function skImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=$('skim');im.setAttribute('href',r.result);im.style.display='';SK.free=true;toast('Plan loaded. Press Set scale and click two points of a known distance.')};r.readAsDataURL(f);inp.value=''}
function skCal(){if($('skim').style.display==='none')return toast('Load a plan image first');SK.cal=[];skDraw()}
function skPre(k){const L=+$('skl').value,W=+$('skw').value;if(!(L>0&&W>0))return toast('Enter Length and Width first');
 const g=[0.1,0.25,0.5,1,2,5].find(x=>L/x<=26&&W/x<=16);if(!g)return toast('Too large for the sketch - use the Length/Width boxes in the calculator');
 SK.g=g;$('skg').value=g;const l=L/g,w=W/g,o=2;SK.pts=k?[[o,o],[o+l,o],[o+l,o+w*.6],[o+l*.6,o+w*.6],[o+l*.6,o+w],[o,o+w]]:[[o,o],[o+l,o],[o+l,o+w],[o,o+w]];SK.closed=true;skDraw()}
function skDraw(){if(!SK)return;const P=SK.pts,px=q=>q[0]*20+','+q[1]*20,n=P.length,eN=SK.closed?n:n-1;let h='';
 if(n>1)h+=`<${SK.closed?'polygon':'polyline'} points="${P.map(px).join(' ')}" fill="${SK.closed?'rgba(240,165,0,.18)':'none'}" stroke="#f0a500" stroke-width="2"/>`;
 for(let i=0;i<eN;i++){const a=P[i],b=P[(i+1)%n],len=+(Math.hypot(a[0]-b[0],a[1]-b[1])*SK.g).toFixed(2);if(len)h+=`<text x="${(a[0]+b[0])*10}" y="${(a[1]+b[1])*10-5}" fill="#e6edf3" font-size="11" text-anchor="middle" style="pointer-events:none">${len} m</text>`}
 P.forEach((q,i)=>h+=`<circle cx="${q[0]*20}" cy="${q[1]*20}" r="${!SK.closed&&i===0&&n>2?8:5}" fill="${i===0?'#3fb950':'#f0a500'}" style="cursor:${SK.closed?'move':'pointer'}"/>`);
 (SK.cal||[]).forEach(q=>h+=`<circle cx="${q[0]*20}" cy="${q[1]*20}" r="6" fill="#58a6ff"/>`);$('skd').innerHTML=h;let info=SK.cal?`Set scale: click ${SK.cal.length?'the second':'the first'} point of a known distance on the plan`:SK.closed?`Area <b style="color:var(--ac)">${N1(skSq())} m&sup2;</b> &middot; drag a corner to adjust`:`${n} point(s) &middot; ${n>2?'click the green point to close':'keep clicking to add corners'}`;$('ski').innerHTML=info+skHints()}

/* live suggestions while sketching (rule based, no external service) */
const skFit=(w,h)=>w>0&&h>0?[0.1,0.25,0.5,1,2,5].find(g=>w*SK.g/g<=26&&h*SK.g/g<=16):0;
const skSeg=(a,b,c,d)=>{const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0};
const skCross=P=>{const n=P.length;for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;if(skSeg(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return true}return false};
function skHints(){const P=SK.pts,n=P.length,h=[],tip=t=>h.push(`<div class="sub" style="margin-top:5px">&#128161; ${t}</div>`);
 if(n>2&&skCross(P))tip('<span class="err">The lines cross each other &mdash; the area will be wrong. Undo or move a corner.</span>');
 if(SK.closed){
  if(n===4){const e=[0,1,2,3].map(i=>{const a=P[i],b=P[(i+1)%4];return[b[0]-a[0],b[1]-a[1]]}),len=v=>Math.hypot(v[0],v[1]),sq=e.every((u,i)=>{const v=e[(i+1)%4];return len(u)&&len(v)&&Math.abs(u[0]*v[0]+u[1]*v[1])/(len(u)*len(v))<.12}),ax=e.every(v=>Math.abs(v[0])<1e-6||Math.abs(v[1])<1e-6);
   if(sq)tip(ax?'Rectangle '+(+(len(e[0])*SK.g).toFixed(2))+' &times; '+(+(len(e[1])*SK.g).toFixed(2))+' m':'It looks like a rectangle but it is tilted &mdash; <span class="lk" onclick="skSquare()">make it an exact rectangle</span>')}
  const xs=P.map(q=>q[0]),ys=P.map(q=>q[1]),w=Math.max(...xs)-Math.min(...xs),hh=Math.max(...ys)-Math.min(...ys),z=skFit(w,hh);
  if(!SK.free&&w<=10&&hh<=7&&z&&z<SK.g)tip('The shape is small on the grid &mdash; <span class="lk" onclick="skZoom()">zoom in to '+z+' m squares</span> for a more accurate drawing');
  if(CALC){const A=skSq(),k=1+Math.max(0,+CALC.waste||0)/100,rs=cRules().slice(0,6);if(rs.length)tip('For '+N1(A)+' m&sup2; ('+E(CALC.group)+'): '+rs.map(m=>E(m.code)+' &times; '+Math.ceil(+(A*m.perM2*k).toFixed(6))).join(' &middot; '))}
 }else if(n>=3)tip('Click the green point to close the shape');
 return h.join('')}
function skSquare(){const P=SK.pts,d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),L=(d(P[0],P[1])+d(P[2],P[3]))/2,W=(d(P[1],P[2])+d(P[3],P[0]))/2,x=Math.min(...P.map(q=>q[0])),y=Math.min(...P.map(q=>q[1]));SK.pts=[[x,y],[x+L,y],[x+L,y+W],[x,y+W]];skDraw()}
function skZoom(){const P=SK.pts,xs=P.map(q=>q[0]),ys=P.map(q=>q[1]),x0=Math.min(...xs),y0=Math.min(...ys),z=skFit(Math.max(...xs)-x0,Math.max(...ys)-y0);if(!z||z>=SK.g)return;const k=SK.g/z;SK.pts=P.map(q=>[(q[0]-x0)*k+2,(q[1]-y0)*k+2]);SK.g=z;$('skg').value=z;skDraw()}
function skUse(){if(!SK||!SK.closed||SK.pts.length<3)return toast('Close the shape first');const a=skSq();if(!(a>0))return toast('The area is zero');
 const nm=$('skn').value.trim()||'Sketch',rec={n:nm,g:SK.g,pts:SK.pts.flatMap(q=>[+q[0].toFixed(3),+q[1].toFixed(3)])};
 NF.areas=NF.areas||[];if(SK.ix>=0)NF.areas[SK.ix]=rec;else NF.areas.push(rec);
 if(CALC){const last=CALC.parts[CALC.parts.length-1],empty=!(last.l||last.w||last.a||last.n),part={n:nm,l:'',w:'',a:String(a)};if(empty)CALC.parts[CALC.parts.length-1]=part;else CALC.parts.push(part)}
 $('sk').remove();SK=null;CALC?calcDraw():renderNew();toast('Sketch added \u2014 press save to keep it with the PR')}

const skP=a=>{const r=[];for(let i=0;i<a.pts.length;i+=2)r.push([a.pts[i],a.pts[i+1]]);return r};
const skMini=(a,w)=>{const P=skP(a),xs=P.map(q=>q[0]),ys=P.map(q=>q[1]),x0=Math.min(...xs),y0=Math.min(...ys),dx=Math.max(...xs)-x0||1,dy=Math.max(...ys)-y0||1,k=Math.min((w-16)/dx,(w*.62-16)/dy);return`<svg width="${w}" height="${Math.round(w*.62)}" style="background:var(--bg);border:1px solid var(--bd);border-radius:6px"><polygon points="${P.map(q=>(8+(q[0]-x0)*k).toFixed(1)+','+(8+(q[1]-y0)*k).toFixed(1)).join(' ')}" fill="rgba(240,165,0,.2)" stroke="#f0a500" stroke-width="1.5"/></svg>`};
const areaSq=a=>+(skArea(skP(a))*a.g*a.g).toFixed(2);
function skBig(i){const a=((PRS[DR&&DR.id]||{}).areas||[])[i];if(!a)return;const P=skP(a),xs=P.map(q=>q[0]),ys=P.map(q=>q[1]),x0=Math.min(...xs),y0=Math.min(...ys),dx=Math.max(...xs)-x0||1,dy=Math.max(...ys)-y0||1,k=Math.min(520/dx,320/dy),X=q=>40+(q[0]-x0)*k,Y=q=>40+(q[1]-y0)*k;
 const lb=P.map((q,j)=>{const r=P[(j+1)%P.length],l=+(Math.hypot(q[0]-r[0],q[1]-r[1])*a.g).toFixed(2);return l?`<text x="${(X(q)+X(r))/2}" y="${(Y(q)+Y(r))/2-6}" fill="#e6edf3" font-size="13" text-anchor="middle">${l} m</text>`:''}).join('');
 const d=document.createElement('div');d.className='modal';d.id='skb';d.onclick=e=>{if(e.target===d)d.remove()};d.innerHTML=`<div class="box" style="width:min(640px,100%)"><h3>${E(a.n)} &middot; ${N1(areaSq(a))} m&sup2;</h3><svg viewBox="0 0 600 400" style="width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;margin-top:10px"><polygon points="${P.map(q=>X(q).toFixed(1)+','+Y(q).toFixed(1)).join(' ')}" fill="rgba(240,165,0,.2)" stroke="#f0a500" stroke-width="2"/>${lb}</svg><div class="tools" style="margin-top:10px"><span style="flex:1"></span><button class="btn" onclick="$('skb').remove()">Close</button></div></div>`;document.body.appendChild(d)}
function areasCard(){const A=NF.areas||[],bt='class="btn sm"';return`<div style="background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:12px 0"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font:800 12px Cairo;color:var(--ac)">رسومات المساحة</b><span style="font-size:11px;color:var(--mu)">بتتحفظ مع الـ PR</span><span style="flex:1"></span><button ${bt} onclick="skOpen()">\u270E ارسم المبنى</button></div>${A.length?`<div style="display:flex;gap:12px;flex-wrap:wrap">${A.map((a,i)=>`<div style="width:150px">${skMini(a,150)}<div style="margin-top:4px"><b>${E(a.n)}</b></div><div style="font-size:11px;color:var(--mu)">${N1(areaSq(a))} m\u00b2 \u00b7 <span style="cursor:pointer;color:var(--ac)" onclick="skOpen(${i})">تعديل</span> \u00b7 <span style="cursor:pointer;color:var(--rd)" onclick="NF.areas.splice(${i},1);renderNew()">حذف</span></div></div>`).join('')}</div>`:'<div style="font-size:11px;color:var(--mu)">مفيش رسمة لسه.</div>'}</div>`}
const areasView=p=>(p.areas||[]).length?`<div><div class="sec">رسومات المساحة (${p.areas.length})</div><div style="display:flex;gap:12px;flex-wrap:wrap">${p.areas.map((a,i)=>`<div style="width:150px;cursor:pointer" onclick="skBig(${i})" title="اضغط للتكبير">${skMini(a,150)}<div style="margin-top:4px"><b>${E(a.n)}</b></div><div style="font-size:11px;color:var(--mu)">${N1(areaSq(a))} m\u00b2</div></div>`).join('')}</div></div>`:'';

</script>
<script>
/* viewers (anyone who is not Admin) cannot export: buttons are hidden by CSS and every export function refuses to run */
(function(){const names=['exportDash','pExport','advXlsx','advPdf','advItemXlsx','advProjXlsx','execPdf','expExcel','expCSV','hacPdfTable','hacXlsxTable','hacBuildXlsx','hacXlsxMulti'];
 names.forEach(n=>{let f;try{f=window[n]}catch(e){}if(typeof f!=='function')return;window[n]=function(){if(!ISADMIN)return toast('التصدير للأدمن بس');return f.apply(this,arguments)}})})();
</script>
</body>
